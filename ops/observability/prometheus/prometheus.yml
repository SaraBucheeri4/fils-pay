global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
  - job_name: settlement
    static_configs:
      - targets: ["settlement:9464"]
  - job_name: sql-exporter
    static_configs:
      - targets: ["sql-exporter:9399"]
